<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Candy Escape — Puzzle Challenge</title><style>
*{box-sizing:border-box}html,body{margin:0;overscroll-behavior:none}body{min-height:100dvh;background:radial-gradient(ellipse at top,#365fa4,#08152e 80%);font-family:system-ui,-apple-system,sans-serif;color:#fff;display:flex;justify-content:center}.app{width:min(100%,480px);padding:18px 13px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:25px;font-weight:950;color:#ffe49a}.sub{font-size:11px;color:#b8d2fa}.timer{border:2px solid #e8bd67;background:#102d5e;border-radius:14px;padding:9px 12px;font-size:23px;font-weight:900;font-variant-numeric:tabular-nums}.panel{margin-top:19px;padding:16px 11px 19px;border:3px solid #c79d55;border-radius:25px;background:linear-gradient(135deg,#2d5897,#15376b);box-shadow:0 15px 30px #0007}.frame{padding:10px}.board{position:relative;direction:ltr;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;border:5px solid #8bbaff;border-radius:13px;background:#244779;background-image:linear-gradient(90deg,#ffffff1c 1px,transparent 1px),linear-gradient(#ffffff1c 1px,transparent 1px);background-size:calc(100% / 6) calc(100% / 6);box-shadow:inset 0 0 18px #07162e;overflow:visible}.piece{position:absolute;top:0;left:0;z-index:3;pointer-events:none;will-change:transform;filter:drop-shadow(0 4px 3px #0008)}.piece.active{z-index:8}.cell{position:absolute;border-radius:18%;border:2px solid #ffffff8a;box-shadow:inset 0 6px 9px #ffffff5c,inset 0 -8px 9px #0003}.cell:before{content:'';position:absolute;left:15%;top:10%;width:43%;height:17%;border-radius:100%;background:#ffffff9b;transform:rotate(-20deg)}.exit{position:absolute;z-index:1;pointer-events:none;border-radius:5px;border:2px solid #102b53;box-shadow:0 0 9px currentColor}.hint{text-align:center;font-size:13px;line-height:1.8;color:#dceaff;margin:10px 3px 13px}.status{text-align:center;min-height:25px;font-weight:800;color:#ffe29a;font-size:14px}.actions{text-align:center;margin-top:9px}button{font:900 15px system-ui;border:2px solid #ffe4a1;background:linear-gradient(#ffdf90,#ce933e);color:#36220d;border-radius:13px;padding:10px 18px}.foot{text-align:center;font-size:11px;color:#a9c9f4;margin-top:16px}</style></head><body><main class="app"><header class="top"><div><div class="brand">🍬 Candy Escape</div><div class="sub">PUZZLE TEST · TIMER TUNING</div></div><div><div class="sub" id="levelLabel" style="text-align:center;font-weight:800">المرحلة 1 / 5</div><div class="timer" id="timer">00:30</div></div></header><section class="panel"><div class="frame"><div class="board" id="board"></div></div><p class="hint">فكّر في ترتيب الحركات وافتح الطريق لكل قطعة. ادفع القطعة للخارج عند فتحتها المطابقة.</p><div class="status" id="status">اسحب الحلوى نحو فتحتها الملونة</div><div class="actions"><button id="reset">↻ إعادة المرحلة</button> <button id="next" style="display:none">المرحلة التالية ←</button></div></section><div class="foot">مخارج معتمدة · توقيت تعليمي أسرع · نفس التحكم والتخريج</div><script>
'use strict';
const N=6,board=document.getElementById('board'),statusEl=document.getElementById('status'),clock=document.getElementById('timer');
const levels=[{"time":30,"pieces":[{"id":"red","color":"#ff597b","shape":[[0,0],[1,0],[2,0]],"x":1,"y":0,"gate":{"side":"right","start":0,"end":0}},{"id":"blue","color":"#4bd6ff","shape":[[0,0],[1,0]],"x":1,"y":5,"gate":{"side":"left","start":4,"end":4}},{"id":"yellow","color":"#ffd44f","shape":[[0,0],[1,0],[2,0],[1,1]],"x":2,"y":3,"gate":{"side":"left","start":1,"end":2}},{"id":"green","color":"#6ee6a1","shape":[[0,0]],"x":0,"y":1,"gate":{"side":"bottom","start":2,"end":2}}]},{"time":30,"pieces":[{"id":"red","color":"#ff597b","shape":[[0,0]],"x":5,"y":0,"gate":{"side":"bottom","start":2,"end":2}},{"id":"blue","color":"#4bd6ff","shape":[[0,0],[0,1],[0,2],[1,2]],"x":2,"y":2,"gate":{"side":"right","start":1,"end":3}},{"id":"yellow","color":"#ffd44f","shape":[[0,0],[0,1],[1,1]],"x":4,"y":4,"gate":{"side":"top","start":2,"end":3}},{"id":"green","color":"#6ee6a1","shape":[[0,0],[0,1],[0,2],[1,2]],"x":0,"y":2,"gate":{"side":"left","start":1,"end":3}}]},{"time":35,"pieces":[{"id":"red","color":"#ff597b","shape":[[0,0],[0,1],[0,2],[1,2]],"x":4,"y":0,"gate":{"side":"top","start":4,"end":5}},{"id":"blue","color":"#4bd6ff","shape":[[0,0],[0,1],[0,2],[1,2]],"x":1,"y":3,"gate":{"side":"bottom","start":4,"end":5}},{"id":"yellow","color":"#ffd44f","shape":[[0,0]],"x":3,"y":4,"gate":{"side":"bottom","start":2,"end":2}},{"id":"green","color":"#6ee6a1","shape":[[0,0],[1,0],[2,0]],"x":0,"y":0,"gate":{"side":"left","start":2,"end":2}},{"id":"purple","color":"#c58bff","shape":[[0,0]],"x":0,"y":2,"gate":{"side":"top","start":0,"end":0}}]},{"time":40,"pieces":[{"id":"red","color":"#ff597b","shape":[[0,0],[1,0],[2,0]],"x":0,"y":2,"gate":{"side":"left","start":2,"end":2}},{"id":"blue","color":"#4bd6ff","shape":[[0,0],[0,1],[1,1]],"x":0,"y":4,"gate":{"side":"bottom","start":1,"end":2}},{"id":"yellow","color":"#ffd44f","shape":[[0,0],[0,1],[0,2],[1,2]],"x":4,"y":1,"gate":{"side":"bottom","start":3,"end":4}},{"id":"green","color":"#6ee6a1","shape":[[0,0]],"x":5,"y":4,"gate":{"side":"left","start":5,"end":5}},{"id":"purple","color":"#c58bff","shape":[[0,0],[1,0],[2,0]],"x":3,"y":0,"gate":{"side":"right","start":2,"end":2}}]},{"time":45,"pieces":[{"id":"red","color":"#ff597b","shape":[[0,0],[0,1],[0,2]],"x":5,"y":0,"gate":{"side":"right","start":0,"end":2}},{"id":"blue","color":"#4bd6ff","shape":[[0,0],[1,0],[2,0]],"x":3,"y":3,"gate":{"side":"bottom","start":3,"end":5}},{"id":"yellow","color":"#ffd44f","shape":[[0,0],[0,1],[0,2],[1,2]],"x":0,"y":1,"gate":{"side":"left","start":1,"end":3}},{"id":"green","color":"#6ee6a1","shape":[[0,0],[0,1],[1,1]],"x":2,"y":4,"gate":{"side":"right","start":4,"end":5}},{"id":"purple","color":"#c58bff","shape":[[0,0],[0,1],[1,1]],"x":1,"y":1,"gate":{"side":"bottom","start":0,"end":1}},{"id":"orange","color":"#ff9e5d","shape":[[0,0],[1,0],[2,0],[1,1]],"x":2,"y":1,"gate":{"side":"top","start":2,"end":4}}]}];
let levelIndex=0;
const levelLabel=document.getElementById('levelLabel'),nextButton=document.getElementById('next');
const currentLevel=()=>levels[levelIndex];
let pieces=[],drag=null,cell=0,remaining=90,timer=null,finished=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const ext=(p,axis)=>Math.max(...p.shape.map(c=>c[axis==='x'?0:1]))+1;
function valid(p,x,y){const eps=.002;for(const [sx,sy] of p.shape){const ax=x+sx,ay=y+sy;if(ax< -eps||ay< -eps||ax+1>N+eps||ay+1>N+eps)return false;for(const other of pieces){if(other.id===p.id)continue;for(const [ox,oy] of other.shape){const bx=other.x+ox,by=other.y+oy;if(ax<bx+1-eps&&ax+1>bx+eps&&ay<by+1-eps&&ay+1>by+eps)return false}}}return true}
function axisMove(p,axis,delta){if(!delta)return;const horizontal=axis==='x',base=p[axis];let target=Math.max(0,Math.min(N-ext(p,axis),base+delta));for(const [sx,sy] of p.shape){const along=horizontal?sx:sy,cross=horizontal?sy:sx;const a=base+along,otherPos=(horizontal?p.y:p.x)+cross;for(const q of pieces){if(q.id===p.id)continue;for(const [qx,qy] of q.shape){const wall=(horizontal?q.x+qx:q.y+qy),wallCross=(horizontal?q.y+qy:q.x+qx);if(otherPos>=wallCross+1-1e-8||otherPos+1<=wallCross+1e-8)continue;if(delta>0&&a+1<=wall+1e-8)target=Math.min(target,wall-1-along);else if(delta<0&&a>=wall+1-1e-8)target=Math.max(target,wall+1-along)}}}p[axis]=target}
function cornerAssist(p,dx,dy){const before={x:p.x,y:p.y};const primary=Math.abs(dx)>=Math.abs(dy)?'x':'y',secondary=primary==='x'?'y':'x';const a=primary==='x'?dx:dy,b=secondary==='x'?dx:dy;axisMove(p,primary,a);const blocked=Math.abs(p[primary]-before[primary])<Math.abs(a)*.25;if(blocked&&Math.abs(b)>.012){axisMove(p,secondary,b);axisMove(p,primary,a)}else axisMove(p,secondary,b)}
function makeCell(color,x,y){const d=document.createElement('div');d.className='cell';d.style.cssText=`left:${x*100}%;top:${y*100}%;width:100%;height:100%;background:linear-gradient(140deg,#ffffffa0,${color} 37%,${color} 75%,#0003)`;return d}
function render(){
 cell=board.clientWidth/N;board.replaceChildren();
 const gateList=currentLevel().pieces.map(p=>({p,g:p.gate}));
 for(const {p,g} of gateList){
  const e=document.createElement('div');e.className='exit';e.style.background=p.color;e.style.color=p.color;
  // Inset each gate to leave a visible dark divider, even if two gates touch.
  const inset=4;
  if(g.side==='top'||g.side==='bottom'){
   e.style.left=`calc(${g.start/N*100}% + ${inset}px)`;
   e.style.width=`calc(${(g.end-g.start+1)/N*100}% - ${inset*2}px)`;
   e.style.height='12px';e.style[g.side]='-11px';
  }else{
   e.style.top=`calc(${g.start/N*100}% + ${inset}px)`;
   e.style.height=`calc(${(g.end-g.start+1)/N*100}% - ${inset*2}px)`;
   e.style.width='12px';e.style[g.side]='-11px';
  }
  board.append(e);
 }
 for(const p of pieces){const el=document.createElement('div');el.className='piece';el.dataset.id=p.id;el.style.width=cell+'px';el.style.height=cell+'px';for(const [x,y] of p.shape)el.append(makeCell(p.color,x,y));board.append(el);p.el=el;paint(p)}
}
function paint(p){if(p.el)p.el.style.transform=`translate3d(${p.x*cell}px,${p.y*cell}px,0)`}
// Exit only after an intentional outward push at an aligned gate.
function gateGeometry(p){
 const g=p.gate,span=(g.side==='left'||g.side==='right')?'y':'x';
 const width=ext(p,span),center=(g.start+g.end+1)/2;
 const target=center-width/2;
 const cross=p[span];
 const gap=Math.max(0,g.start-cross,cross+width-(g.end+1));
 const edge=g.side==='right'?N-(p.x+ext(p,'x')):g.side==='left'?p.x:g.side==='top'?p.y:N-(p.y+ext(p,'y'));
 return {span,target,gap,edge};
}
function gateReady(p){
 const z=gateGeometry(p);
 return z.gap<=.12&&z.edge<=.34;
}
// Assistance only after an outward gesture: never auto-exit by proximity.
function assistExitAlignment(p){
 const z=gateGeometry(p);
 if(z.edge>.42||z.gap>.65)return;
 // Move gently toward the opening; collision logic stays unchanged.
 const desired=Math.max(0,Math.min(N-ext(p,z.span),z.target));
 const delta=Math.max(-.24,Math.min(.24,desired-p[z.span]));
 axisMove(p,z.span,delta);
}
function down(e){if(finished||remaining<=0||drag)return;const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/cell,y=(e.clientY-r.top)/cell;const p=[...pieces].reverse().find(p=>p.shape.some(([sx,sy])=>x>=p.x+sx&&x<=p.x+sx+1&&y>=p.y+sy&&y<=p.y+sy+1));if(!p)return;e.preventDefault();if(p.el)p.el.style.transition='';drag={p,id:e.pointerId,lastX:e.clientX,lastY:e.clientY,outward:0};p.el.classList.add('active');board.setPointerCapture(e.pointerId);statusEl.textContent='عند الفتحة، ادفع الحلوى للخارج بإصبعك'}
function removePiece(p){if(p.el){p.el.style.transition='opacity 170ms ease-out,transform 170ms ease-out';p.el.style.opacity='0';const g=p.gate,dx=g.side==='right'?cell:g.side==='left'?-cell:0,dy=g.side==='bottom'?cell:g.side==='top'?-cell:0;p.el.style.transform=`translate3d(${p.x*cell+dx}px,${p.y*cell+dy}px,0)`}pieces=pieces.filter(q=>q.id!==p.id);drag=null;if(!pieces.length){finished=true;clearInterval(timer);statusEl.textContent=levelIndex===levels.length-1?'🏆 ممتاز! أنهيت المراحل الخمس!':'🎉 ممتاز! خلصت المرحلة!';nextButton.style.display=levelIndex===levels.length-1?'none':'inline-block'}else statusEl.textContent='✨ خرجت الحلوى! كمل باقي الألوان';setTimeout(render,185)}
function move(e){
 if(!drag||drag.id!==e.pointerId)return;
 e.preventDefault();
 const d=drag,dx=(e.clientX-d.lastX)/cell,dy=(e.clientY-d.lastY)/cell;
 d.lastX=e.clientX;d.lastY=e.clientY;
 cornerAssist(d.p,dx,dy);
 const g=d.p.gate;
 const outward=g.side==='right'?dx:g.side==='left'?-dx:g.side==='bottom'?dy:-dy;
 const z=gateGeometry(d.p);
 // Only collect exit intent near the correct edge; a sideways swipe alone never exits.
 if(z.edge<=.42&&z.gap<=.65){
   d.outward=Math.max(0,Math.min(1.5,d.outward+outward));
   if(d.outward>.065)assistExitAlignment(d.p);
   if(d.outward>=.20&&gateReady(d.p)){
     paint(d.p);
     try{board.releasePointerCapture(e.pointerId)}catch(_){}
     removePiece(d.p);return;
   }
 }else d.outward=0;
 paint(d.p);
}
function up(e){if(!drag||drag.id!==e.pointerId)return;const p=drag.p;drag=null;p.el.classList.remove('active');let best=null;for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(valid(p,x,y)){const distance=(x-p.x)**2+(y-p.y)**2;if(!best||distance<best.distance)best={x,y,distance}}if(best){p.x=best.x;p.y=best.y}p.el.style.transition='transform 110ms ease-out';paint(p);setTimeout(()=>{if(p.el)p.el.style.transition=''},130)}
function reset(){clearInterval(timer);pieces=clone(currentLevel().pieces);drag=null;finished=false;remaining=currentLevel().time;nextButton.style.display='none';levelLabel.textContent=`المرحلة ${levelIndex+1} / ${levels.length}`;clock.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;clock.style.color='#fff';statusEl.textContent='قرّب الحلوى من فتحتها ثم ادفعها للخارج';render();timer=setInterval(()=>{if(finished)return;remaining=Math.max(0,remaining-1);clock.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;clock.style.color=remaining<=15?'#ff718a':'#fff';if(!remaining){clearInterval(timer);statusEl.textContent='⏰ انتهى الوقت — أعد المرحلة'}},1000)}
board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);document.getElementById('reset').addEventListener('click',reset);nextButton.addEventListener('click',()=>{if(!finished||levelIndex>=levels.length-1)return;levelIndex++;reset()});window.addEventListener('resize',()=>{if(!drag)render()});reset();
</script></main></body></html>
