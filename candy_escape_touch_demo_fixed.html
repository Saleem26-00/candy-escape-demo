<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Candy Escape – Touch Demo</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#244c93,#091831 75%);font-family:system-ui,'Segoe UI',sans-serif;color:#fff;display:flex;justify-content:center}.app{width:min(100%,480px);padding:16px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:1000;font-size:27px;color:#ffdf83;text-shadow:0 3px 0 #8a511d}.sub{font-size:12px;color:#b6d4ff}.timer{border:2px solid #d9ad5d;background:#102f65;border-radius:14px;padding:8px 14px;font-weight:900;font-size:23px;font-variant-numeric:tabular-nums}.panel{margin-top:20px;background:linear-gradient(140deg,#2d5da3,#173667);border:3px solid #b98a3b;border-radius:24px;padding:18px 10px 22px;box-shadow:0 16px 32px #0006,inset 0 1px 8px #fff2}.board{width:100%;aspect-ratio:1;position:relative;touch-action:none;user-select:none;direction:ltr}.board-inner{position:absolute;inset:6%;border:8px solid #82b6ff;border-radius:13px;background:repeating-linear-gradient(0deg,transparent 0 calc(16.666% - 1px),#ffffff16 calc(16.666% - 1px) 16.666%),repeating-linear-gradient(90deg,#244a82 0 calc(16.666% - 1px),#ffffff18 calc(16.666% - 1px) 16.666%);box-shadow:inset 0 0 20px #0007,0 6px 12px #07142d;overflow:visible}.piece{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 4px 2px #06152b88)}.piece:active{cursor:grabbing;z-index:10}.piece svg{width:100%;height:100%;overflow:visible}.exit{position:absolute;z-index:2;box-shadow:0 0 9px currentColor;border-radius:4px;pointer-events:none}.hint{text-align:center;color:#d7e7ff;font-size:14px;margin:15px 8px}.actions{display:flex;gap:10px;justify-content:center}button{border:2px solid #f7d588;border-radius:13px;background:linear-gradient(#f4c76c,#c78d36);color:#382313;font-size:16px;font-weight:900;padding:10px 20px;cursor:pointer}.status{text-align:center;min-height:24px;color:#ffe79e;font-weight:800;margin-top:12px}.foot{font-size:12px;color:#9fbce4;text-align:center;margin-top:20px}.board-inner:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:5px;box-shadow:inset 0 0 12px #06162e88}
</style></head><body><main class="app"><div class="top"><div><div class="brand">🍬 Candy Escape</div><div class="sub">TOUCH PROTOTYPE · LEVEL 01</div></div><div class="timer" id="timer">01:30</div></div><section class="panel"><div class="board" id="board"><div class="board-inner" id="inner"><div class="exit" style="right:-8px;top:16.666%;height:16.666%;width:9px;background:#ff5778"></div><div class="exit" style="bottom:-8px;left:50%;width:16.666%;height:9px;background:#4bd6ff"></div><div class="exit" style="left:-8px;top:66.666%;height:16.666%;width:9px;background:#ffd44f"></div><div class="exit" style="top:-8px;left:66.666%;width:16.666%;height:9px;background:#6ee6a1"></div><div class="piece" style="left:16.666%;top:16.666%;width:33.333%;height:16.666%;background:linear-gradient(145deg,#ffb1c1,#ff5778 48%,#a92249);border:2px solid #ffc2d0;border-radius:14px"></div><div class="piece" style="left:50%;top:33.333%;width:16.666%;height:33.333%;background:linear-gradient(145deg,#c5f4ff,#4bd6ff 48%,#1476b4);border:2px solid #b6f5ff;border-radius:14px"></div><div class="piece" style="left:16.666%;top:66.666%;width:33.333%;height:16.666%;background:linear-gradient(145deg,#fff5b2,#ffd44f 48%,#b77c12);border:2px solid #fff1b0;border-radius:14px"></div><div class="piece" style="left:66.666%;top:0%;width:16.666%;height:33.333%;background:linear-gradient(145deg,#d0ffe6,#6ee6a1 48%,#189767);border:2px solid #d0ffe6;border-radius:14px"></div></div></div><div class="hint">اسحب قطعة الحلوى مباشرة باتجاه المخرج المطابق للونها</div><div class="actions"><button id="reset">↻ إعادة المرحلة</button></div><div class="status" id="status"></div></section><div class="foot">إذا ظهرت القطع لكن لا تتحرك، افتح الملف في Safari؛ بعض معاينات الملفات لا تشغّل JavaScript</div></main><script>
const N=6, initial=[{id:'red',color:'#ff5778',cells:[[1,1],[2,1]],exit:{side:'right',start:1,end:1}},{id:'blue',color:'#4bd6ff',cells:[[3,2],[3,3]],exit:{side:'bottom',start:3,end:3}},{id:'yellow',color:'#ffd44f',cells:[[1,4],[2,4]],exit:{side:'left',start:4,end:4}},{id:'green',color:'#6ee6a1',cells:[[4,0],[4,1]],exit:{side:'top',start:4,end:4}}];let pieces=[],remaining=90,timer=null,drag=null;const inner=document.getElementById('inner'),status=document.getElementById('status'),clock=document.getElementById('timer');const clone=x=>JSON.parse(JSON.stringify(x));function occupied(except){return new Set(pieces.filter(p=>p.id!==except).flatMap(p=>p.cells.map(c=>c.join(','))))}function valid(p,dx,dy){const occ=occupied(p.id);return p.cells.every(([x,y])=>x+dx>=0&&x+dx<N&&y+dy>=0&&y+dy<N&&!occ.has([x+dx,y+dy].join(',')))}function maxStep(p,axis,sign){let n=0;while(valid(p,axis==='x'?sign*(n+1):0,axis==='y'?sign*(n+1):0))n++;return n}function cellSize(){return inner.clientWidth/N}function draw(){inner.querySelectorAll('.piece,.exit').forEach(e=>e.remove());for(const p of initial){const e=p.exit,div=document.createElement('div');div.className='exit';div.style.background=p.color;div.style.color=p.color;const a=100/N;if(e.side==='top'||e.side==='bottom'){div.style.left=(e.start*a)+'%';div.style.width=((e.end-e.start+1)*a)+'%';div.style.height='9px';div.style[e.side]='-8px'}else{div.style.top=(e.start*a)+'%';div.style.height=((e.end-e.start+1)*a)+'%';div.style.width='9px';div.style[e.side]='-8px'}inner.append(div)}for(const p of pieces){const xs=p.cells.map(c=>c[0]),ys=p.cells.map(c=>c[1]),x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x+1,h=Math.max(...ys)-y+1;const div=document.createElement('div');div.className='piece';div.dataset.id=p.id;div.style.left=x/N*100+'%';div.style.top=y/N*100+'%';div.style.width=w/N*100+'%';div.style.height=h/N*100+'%';const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${w*100} ${h*100}`);const coords=new Set(p.cells.map(([cx,cy])=>`${cx-x},${cy-y}`));for(const [cx,cy] of p.cells){const localX=cx-x,localY=cy-y;const rect=document.createElementNS(ns,'rect');rect.setAttribute('x',localX*100+2);rect.setAttribute('y',localY*100+2);rect.setAttribute('width',96);rect.setAttribute('height',96);rect.setAttribute('rx',coords.has(`${localX-1},${localY}`)||coords.has(`${localX+1},${localY}`)||coords.has(`${localX},${localY-1}`)||coords.has(`${localX},${localY+1}`)?13:24);rect.setAttribute('fill',p.color);rect.setAttribute('stroke','#ffffff77');rect.setAttribute('stroke-width','3');svg.append(rect);const shine=document.createElementNS(ns,'ellipse');shine.setAttribute('cx',localX*100+31);shine.setAttribute('cy',localY*100+22);shine.setAttribute('rx',21);shine.setAttribute('ry',9);shine.setAttribute('fill','#ffffff88');svg.append(shine)}div.append(svg);div.addEventListener('pointerdown',e=>startDrag(e,p.id,div));inner.append(div)}}function startDrag(e,id,el){if(remaining<=0)return;const p=pieces.find(x=>x.id===id);if(!p)return;e.preventDefault();el.setPointerCapture(e.pointerId);drag={id,el,startX:e.clientX,startY:e.clientY,axis:null,delta:0};el.addEventListener('pointermove',onMove);el.addEventListener('pointerup',onUp,{once:true});el.addEventListener('pointercancel',onUp,{once:true})}function onMove(e){if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(!drag.axis&&Math.max(Math.abs(dx),Math.abs(dy))>8)drag.axis=Math.abs(dx)>=Math.abs(dy)?'x':'y';if(!drag.axis)return;const p=pieces.find(x=>x.id===drag.id),v=drag.axis==='x'?dx:dy,sign=Math.sign(v);const limit=maxStep(p,drag.axis,sign),d=Math.min(Math.abs(v),limit*cellSize());drag.delta=sign*d;drag.el.style.transform=drag.axis==='x'?`translateX(${drag.delta}px)`:`translateY(${drag.delta}px)`}function canExit(p,axis,sign){const e=p.exit;if((e.side==='left'&&!(axis==='x'&&sign===-1))||(e.side==='right'&&!(axis==='x'&&sign===1))||(e.side==='top'&&!(axis==='y'&&sign===-1))||(e.side==='bottom'&&!(axis==='y'&&sign===1)))return false;const border=p.cells.some(([x,y])=>e.side==='left'?x===0:e.side==='right'?x===N-1:e.side==='top'?y===0:y===N-1);if(!border)return false;const across=p.cells.map(([x,y])=>e.side==='left'||e.side==='right'?y:x);if(Math.min(...across)<e.start||Math.max(...across)>e.end)return false;const other=occupied(p.id);let shifted=p.cells.map(c=>c.slice());for(let step=0;step<N+1;step++){shifted=shifted.map(([x,y])=>[x+(axis==='x'?sign:0),y+(axis==='y'?sign:0)]);if(shifted.some(c=>other.has(c.join(','))))return false}return true}function onUp(e){if(!drag)return;const d=drag;d.el.removeEventListener('pointermove',onMove);drag=null;const p=pieces.find(x=>x.id===d.id);if(!p)return;const step=Math.round(Math.abs(d.delta)/cellSize())*Math.sign(d.delta);const axis=d.axis;if(axis&&step){p.cells=p.cells.map(([x,y])=>[x+(axis==='x'?step:0),y+(axis==='y'?step:0)])}if(axis&&canExit(p,axis,Math.sign(d.delta))){const raw=axis==='x'?e.clientX-d.startX:e.clientY-d.startY;const beyond=Math.abs(raw)-Math.abs(d.delta);if(beyond>cellSize()*.32){pieces=pieces.filter(x=>x.id!==p.id);status.textContent='✨ ممتاز! خرجت قطعة '+({red:'حمراء',blue:'زرقاء',yellow:'صفراء',green:'خضراء'}[p.id])}}draw();if(!pieces.length){clearInterval(timer);status.textContent='🎉 مبروك! خرجت كل الحلوى!'}}function tick(){remaining=Math.max(0,remaining-1);clock.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');clock.style.color=remaining<=15?'#ff6b82':'#fff';if(!remaining){clearInterval(timer);status.textContent='انتهى الوقت! جرّب مرة ثانية'}}function reset(){pieces=clone(initial);remaining=90;clock.textContent='01:30';clock.style.color='#fff';status.textContent='';drag=null;clearInterval(timer);timer=setInterval(tick,1000);draw()}document.getElementById('reset').onclick=reset;reset();</script></body></html>
