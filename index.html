<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Candy Escape — Drag Test v2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overscroll-behavior:none}body{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#325ca0,#09152f 78%);display:flex;justify-content:center}.app{width:min(100%,480px);padding:18px 13px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:26px;font-weight:1000;color:#ffe19a;text-shadow:0 3px #9b6228}.small{font-size:11px;color:#bbd6ff}.timer{border:2px solid #eac06b;background:#102d5e;border-radius:14px;padding:8px 13px;font-weight:900;font-size:23px;font-variant-numeric:tabular-nums}.panel{margin-top:22px;padding:20px 11px 22px;border:3px solid #c59a50;border-radius:26px;background:linear-gradient(140deg,#2e5b9e,#17376a);box-shadow:0 18px 35px #0007}.board{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;direction:ltr}.grid{position:absolute;inset:5.5%;border:7px solid #8bbaff;border-radius:14px;background:repeating-linear-gradient(90deg,transparent 0 calc(16.666% - 1px),#ffffff22 calc(16.666% - 1px) 16.666%),repeating-linear-gradient(0deg,#244a83 0 calc(16.666% - 1px),#ffffff1a calc(16.666% - 1px) 16.666%);box-shadow:inset 0 0 20px #051630,0 8px 15px #08193288;overflow:visible}.piece{position:absolute;touch-action:none;cursor:grab;filter:drop-shadow(0 4px 3px #0008);will-change:transform;z-index:3}.piece.dragging{z-index:8;cursor:grabbing}.piece svg{width:100%;height:100%;overflow:visible;pointer-events:none}.exit{position:absolute;z-index:2;pointer-events:none;border-radius:4px;box-shadow:0 0 12px currentColor}.hint{text-align:center;font-size:13px;line-height:1.7;color:#e2edff;margin:16px 0}.actions{text-align:center}button{font:900 16px system-ui;border:2px solid #ffe29b;background:linear-gradient(#ffda80,#ce9137);border-radius:13px;padding:11px 20px;color:#3d2912}.status{text-align:center;min-height:26px;color:#ffe38d;font-weight:800;margin-top:12px}.foot{text-align:center;font-size:11px;color:#a9c8f4;margin-top:18px}
</style></head><body><main class="app"><div class="top"><div><div class="brand">🍬 Candy Escape</div><div class="small">DRAG TEST v2 · LEVEL 01</div></div><div class="timer" id="timer">01:30</div></div><section class="panel"><div class="board" id="board"><div class="grid" id="grid"></div></div><div class="hint">اسحب الحلوى بإصبعك، وغيّر الاتجاه أثناء نفس السحبة. كل لون يخرج من فتحته.</div><div class="actions"><button id="reset">↻ إعادة المرحلة</button></div><div class="status" id="status"></div></section><div class="foot">نسخة لاختبار التحكم والخروج — ليست الرسومات النهائية</div></main><script>
'use strict';
const N=6;
// Gates cover the full perpendicular span of their matching pieces.
const initial=[
{id:'red',color:'#ff597b',cells:[[1,1],[2,1]],gate:{side:'right',start:1,end:1}},
{id:'blue',color:'#4bd6ff',cells:[[3,2],[3,3]],gate:{side:'bottom',start:3,end:3}},
{id:'yellow',color:'#ffd44f',cells:[[1,4],[2,4]],gate:{side:'left',start:4,end:4}},
{id:'green',color:'#6ee6a1',cells:[[4,0],[4,1]],gate:{side:'top',start:4,end:4}}];
const grid=document.getElementById('grid'),status=document.getElementById('status'),clock=document.getElementById('timer');
let pieces=[],drag=null,remaining=90,timer=null;
const copy=o=>JSON.parse(JSON.stringify(o));
const size=()=>grid.clientWidth/N;
const occupied=id=>new Set(pieces.filter(p=>p.id!==id).flatMap(p=>p.cells.map(([x,y])=>`${x},${y}`)));
function canPlace(p,dx,dy){const occ=occupied(p.id);return p.cells.every(([x,y])=>x+dx>=0&&x+dx<N&&y+dy>=0&&y+dy<N&&!occ.has(`${x+dx},${y+dy}`))}
function atExit(p,dir){const g=p.gate;if((dir==='right'&&g.side!=='right')||(dir==='left'&&g.side!=='left')||(dir==='up'&&g.side!=='top')||(dir==='down'&&g.side!=='bottom'))return false;
const xs=p.cells.map(c=>c[0]),ys=p.cells.map(c=>c[1]);const touching=dir==='right'?Math.max(...xs)===N-1:dir==='left'?Math.min(...xs)===0:dir==='up'?Math.min(...ys)===0:Math.max(...ys)===N-1;
const cross=(dir==='right'||dir==='left')?ys:xs;return touching&&Math.min(...cross)>=g.start&&Math.max(...cross)<=g.end}
function createSvg(p){const xs=p.cells.map(c=>c[0]),ys=p.cells.map(c=>c[1]);const minX=Math.min(...xs),minY=Math.min(...ys),w=Math.max(...xs)-minX+1,h=Math.max(...ys)-minY+1;const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${w*100} ${h*100}`);
const defs=document.createElementNS(ns,'defs'),grad=document.createElementNS(ns,'linearGradient');grad.id=`g-${p.id}`;grad.setAttribute('x1','0');grad.setAttribute('y1','0');grad.setAttribute('x2','.8');grad.setAttribute('y2','1');for(const [offset,col] of [['0%','#ffffff'],['36%',p.color],['100%',p.color]]){const stop=document.createElementNS(ns,'stop');stop.setAttribute('offset',offset);stop.setAttribute('stop-color',col);if(offset==='0%')stop.setAttribute('stop-opacity','.75');grad.append(stop)}defs.append(grad);svg.append(defs);
for(const [x,y] of p.cells){const rx=(x-minX)*100,ry=(y-minY)*100;const r=document.createElementNS(ns,'rect');for(const [k,v] of Object.entries({x:rx+2,y:ry+2,width:96,height:96,rx:18,fill:`url(#g-${p.id})`,stroke:'#ffffff77','stroke-width':2}))r.setAttribute(k,v);svg.append(r);const e=document.createElementNS(ns,'ellipse');for(const [k,v] of Object.entries({cx:rx+31,cy:ry+21,rx:21,ry:9,fill:'#ffffff99'}))e.setAttribute(k,v);svg.append(e)}return {svg,minX,minY,w,h}}
function draw(){grid.querySelectorAll('.piece,.exit').forEach(el=>el.remove());for(const p of initial){const g=p.gate,el=document.createElement('div');el.className='exit';el.style.background=p.color;el.style.color=p.color;if(g.side==='top'||g.side==='bottom'){el.style.left=`${g.start/N*100}%`;el.style.width=`${(g.end-g.start+1)/N*100}%`;el.style.height='10px';el.style[g.side]='-9px'}else{el.style.top=`${g.start/N*100}%`;el.style.height=`${(g.end-g.start+1)/N*100}%`;el.style.width='10px';el.style[g.side]='-9px'}grid.append(el)}
for(const p of pieces){const {svg,minX,minY,w,h}=createSvg(p),el=document.createElement('div');el.className='piece';el.dataset.id=p.id;el.style.left=`${minX/N*100}%`;el.style.top=`${minY/N*100}%`;el.style.width=`${w/N*100}%`;el.style.height=`${h/N*100}%`;el.append(svg);grid.append(el)}}
function positionPiece(d){const p=pieces.find(p=>p.id===d.id);if(!p)return;const xs=p.cells.map(c=>c[0]),ys=p.cells.map(c=>c[1]);d.el.style.left=`${Math.min(...xs)/N*100}%`;d.el.style.top=`${Math.min(...ys)/N*100}%`;d.el.style.transform=`translate(${d.fx*size()}px,${d.fy*size()}px)`}
function axisStep(d,axis,delta){if(!delta)return;const p=pieces.find(p=>p.id===d.id);if(!p)return;const unit=size(),dir=Math.sign(delta);const key=axis==='x'?'fx':'fy';let fraction=d[key],remainingPixels=delta;
// Allow fractional travel within a cell; commit each completed grid cell.
for(let iter=0;iter<30&&Math.abs(remainingPixels)>0.01;iter++){
 const wanted=fraction+remainingPixels/unit;const target=dir>0?Math.min(wanted,1):Math.max(wanted,-1);
 const stepDir=target>=1?1:target<=-1?-1:0;
 if(stepDir){const dx=axis==='x'?stepDir:0,dy=axis==='y'?stepDir:0;if(!canPlace(p,dx,dy)){d[key]=Math.max(-.98,Math.min(.98,fraction));return}
 p.cells=p.cells.map(([x,y])=>[x+dx,y+dy]);remainingPixels-=(stepDir-fraction)*unit;fraction=0;d[key]=0;positionPiece(d);
 }else{
 // Stop before collision, never allow moving diagonally at once.
 if(!canPlace(p,axis==='x'?dir:0,axis==='y'?dir:0)){d[key]=0;return}
 d[key]=target;return;
 }
 }
 d[key]=fraction;
}
function pointerDown(e){const el=e.target.closest('.piece');if(!el||remaining<=0)return;const p=pieces.find(p=>p.id===el.dataset.id);if(!p)return;e.preventDefault();grid.setPointerCapture(e.pointerId);drag={id:p.id,el,pointerId:e.pointerId,lastX:e.clientX,lastY:e.clientY,fx:0,fy:0,carryX:0,carryY:0,exitDir:null};el.classList.add('dragging');status.textContent=''}
function pointerMove(e){const d=drag;if(!d||e.pointerId!==d.pointerId)return;e.preventDefault();let dx=e.clientX-d.lastX,dy=e.clientY-d.lastY;d.lastX=e.clientX;d.lastY=e.clientY;
// Choose one cardinal axis per pointer sample. Axis can change during same touch.
const axis=Math.abs(dx)>=Math.abs(dy)?'x':'y';const delta=axis==='x'?dx:dy;
// Snap partial travel to the nearest cell before turning: no diagonal piece motion.
if(axis==='x'&&d.fy!==0){if(Math.abs(d.fy)>=.5){const p=pieces.find(p=>p.id===d.id);const s=Math.sign(d.fy);if(canPlace(p,0,s))p.cells=p.cells.map(([x,y])=>[x,y+s])}d.fy=0}
if(axis==='y'&&d.fx!==0){if(Math.abs(d.fx)>=.5){const p=pieces.find(p=>p.id===d.id);const s=Math.sign(d.fx);if(canPlace(p,s,0))p.cells=p.cells.map(([x,y])=>[x+s,y])}d.fx=0}
axisStep(d,axis,delta);positionPiece(d);
const p=pieces.find(p=>p.id===d.id);const dir=axis==='x'?(delta>0?'right':'left'):(delta>0?'down':'up');
if(p&&atExit(p,dir)){const rect=grid.getBoundingClientRect();const margin=size()*.34;const beyond=dir==='right'?e.clientX-rect.right:dir==='left'?rect.left-e.clientX:dir==='down'?e.clientY-rect.bottom:rect.top-e.clientY;if(beyond>margin){pieces=pieces.filter(x=>x.id!==p.id);drag=null;try{grid.releasePointerCapture(e.pointerId)}catch(_){}draw();status.textContent=`✨ خرجت الحلوى ${p.id==='blue'?'السماوية':p.id==='red'?'الحمراء':p.id==='yellow'?'الصفراء':'الخضراء'}!`;if(!pieces.length){clearInterval(timer);status.textContent='🎉 مبروك! خرجت جميع القطع!'}}}
}
function pointerUp(e){const d=drag;if(!d||e.pointerId!==d.pointerId)return;const p=pieces.find(p=>p.id===d.id);if(p){if(Math.abs(d.fx)>=.5&&canPlace(p,Math.sign(d.fx),0))p.cells=p.cells.map(([x,y])=>[x+Math.sign(d.fx),y]);if(Math.abs(d.fy)>=.5&&canPlace(p,0,Math.sign(d.fy)))p.cells=p.cells.map(([x,y])=>[x,y+Math.sign(d.fy)])}drag=null;draw()}
function reset(){pieces=copy(initial);drag=null;remaining=90;clock.textContent='01:30';clock.style.color='white';status.textContent='';clearInterval(timer);timer=setInterval(()=>{remaining=Math.max(0,remaining-1);clock.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;clock.style.color=remaining<=15?'#ff6e86':'white';if(!remaining){clearInterval(timer);status.textContent='انتهى الوقت، أعد المحاولة'}},1000);draw()}
grid.addEventListener('pointerdown',pointerDown);grid.addEventListener('pointermove',pointerMove);grid.addEventListener('pointerup',pointerUp);grid.addEventListener('pointercancel',pointerUp);document.getElementById('reset').addEventListener('click',reset);reset();
</script></body></html>
