<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Candy Escape — Drag Lab 3</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#193e77,#07162f);font-family:system-ui,sans-serif;color:#fff;min-height:100dvh;display:flex;justify-content:center}.app{width:min(100%,480px);padding:22px 14px;text-align:center}h1{color:#ffe19a;margin:0;font-size:26px}p{line-height:1.7;color:#d2e5ff;font-size:14px}.frame{margin:20px auto;padding:14px;background:#234c86;border:3px solid #cda85f;border-radius:22px}.board{position:relative;width:100%;aspect-ratio:1;direction:ltr;touch-action:none;user-select:none;-webkit-user-select:none;border:5px solid #83b4fc;border-radius:12px;background-color:#234779;background-image:linear-gradient(90deg,#ffffff1b 1px,transparent 1px),linear-gradient(#ffffff1b 1px,transparent 1px);background-size:calc(100% / 6) calc(100% / 6);overflow:hidden}.piece,.obstacle{position:absolute;top:0;left:0;pointer-events:none;will-change:transform}.piece{z-index:3;filter:drop-shadow(0 4px 3px #0006)}.cell{position:absolute;border-radius:19%;border:2px solid #ffffff77;box-shadow:inset 0 6px 9px #ffffff55,inset 0 -7px 9px #0002}.piece .cell{background:linear-gradient(140deg,#ffc1df,#f75b9a 45%,#d92d72)}.obstacle .cell{background:linear-gradient(140deg,#d5d9e8,#7185a9 60%,#465c83)}.cell:before{content:'';position:absolute;left:15%;top:11%;width:40%;height:16%;border-radius:100%;background:#ffffffaa;transform:rotate(-20deg)}button{background:#f8cb67;color:#33230b;font-weight:800;font-size:16px;border:0;border-radius:12px;padding:12px 24px}.stats{color:#f8e2a6;font-size:13px;min-height:22px}.foot{color:#aac7ef;font-size:12px}</style></head><body><main class="app"><h1>🍬 Candy Escape</h1><p>اختبار الانزلاق حول العائق — امسك الحلوى الوردية، ولف فيها حول العائق الرمادي بنفس اللمسة. ما فيه مؤقت ولا مخارج.</p><div class="frame"><div class="board" id="board"><div class="obstacle" id="obstacle"></div><div class="piece" id="piece"></div></div></div><div class="stats" id="stats">جاهز للتجربة</div><button id="reset">↻ إعادة التجربة</button><p class="foot">Drag Lab 3 · تحسين خفيف عند الزوايا · مقارنة مع النسخة الثانية</p><script>
'use strict';
const N=6,board=document.getElementById('board'),piece=document.getElementById('piece'),obstacle=document.getElementById('obstacle'),stats=document.getElementById('stats');
const shape=[[0,0],[1,0],[0,1]],block=[[3,2],[3,3],[4,3]];
let pos={x:1,y:1},drag=null,cell=0;
function size(){cell=board.clientWidth/N;return cell}
function makeCells(el,cells){el.innerHTML='';for(const [x,y] of cells){const d=document.createElement('div');d.className='cell';d.style.left=(x*100)+'%';d.style.top=(y*100)+'%';d.style.width='100%';d.style.height='100%';el.append(d)}}
function layout(){size();piece.style.width=cell+'px';piece.style.height=cell+'px';obstacle.style.width=cell+'px';obstacle.style.height=cell+'px';makeCells(piece,shape);makeCells(obstacle,block);obstacle.style.transform='translate3d(0,0,0)';paint()}
function paint(){piece.style.transform=`translate3d(${pos.x*cell}px,${pos.y*cell}px,0)`}
// A piece may move in both directions over one gesture, but each tiny step is orthogonal.
// Collision checks the entire shape continuously; no grid alignment is required to turn.
function valid(x,y){const eps=.002;for(const [sx,sy] of shape){const ax=x+sx,ay=y+sy;if(ax < -eps||ay < -eps||ax+1>N+eps||ay+1>N+eps)return false;for(const [bx,by] of block){if(ax<bx+1-eps&&ax+1>bx+eps&&ay<by+1-eps&&ay+1>by+eps)return false}}return true}
// Sweep to the exact first contact, instead of stopping a small step early.
// Independent X/Y resolution lets the candy glide along walls and around corners.
function axisMove(axis,delta){
 if(!delta)return;
 const horizontal=axis==='x';
 const base=horizontal?pos.x:pos.y;
 let target=base+delta;
 const maxShape=Math.max(...shape.map(c=>c[horizontal?0:1]))+1;
 target=Math.max(0,Math.min(N-maxShape,target));
 for(const [sx,sy] of shape){
  const along=horizontal?sx:sy, cross=horizontal?sy:sx;
  const a=base+along, other=(horizontal?pos.y:pos.x)+cross;
  for(const [bx,by] of block){
   const wall=horizontal?bx:by, wallCross=horizontal?by:bx;
   // Tangent contact is allowed; only overlapping perpendicular spans block travel.
   if(other>=wallCross+1-1e-8||other+1<=wallCross+1e-8)continue;
   if(delta>0 && a+1<=wall+1e-8){
    target=Math.min(target,wall-1-along);
   }else if(delta<0 && a>=wall+1-1e-8){
    target=Math.max(target,wall+1-along);
   }
  }
 }
 if(horizontal)pos.x=target;else pos.y=target;
}
function down(e){const r=board.getBoundingClientRect(),x=(e.clientX-r.left)/cell,y=(e.clientY-r.top)/cell;const hit=shape.some(([sx,sy])=>x>=pos.x+sx&&x<=pos.x+sx+1&&y>=pos.y+sy&&y<=pos.y+sy+1);if(!hit)return;e.preventDefault();drag={id:e.pointerId,lastX:e.clientX,lastY:e.clientY};board.setPointerCapture(e.pointerId);stats.textContent='اسحب وغيّر الاتجاه بدون رفع إصبعك'}
// Tiny corner assist: when a diagonal drag reaches a corner, try the
// other axis first with a small look-ahead. Never move through a wall.
function cornerAssist(dx,dy){
 const before={...pos};
 const primary=Math.abs(dx)>=Math.abs(dy)?'x':'y';
 const secondary=primary==='x'?'y':'x';
 const a=primary==='x'?dx:dy,b=secondary==='x'?dx:dy;
 axisMove(primary,a);
 const blocked=Math.abs(pos[primary]-before[primary])<Math.abs(a)*.25;
 if(blocked && Math.abs(b)>.012){
   // Give the perpendicular motion priority when the main axis is blocked.
   axisMove(secondary,b);
   axisMove(primary,a);
 }else axisMove(secondary,b);
}
function move(e){if(!drag||e.pointerId!==drag.id)return;e.preventDefault();const dx=(e.clientX-drag.lastX)/cell,dy=(e.clientY-drag.lastY)/cell;drag.lastX=e.clientX;drag.lastY=e.clientY;
// Process both axes in sequence, larger displacement first. This avoids diagonal tunneling.
cornerAssist(dx,dy);paint()}
function up(e){if(!drag||e.pointerId!==drag.id)return;drag=null;const x=Math.round(pos.x),y=Math.round(pos.y);if(valid(x,y)){pos.x=x;pos.y=y}else{let best=null;for(let ix=0;ix<N;ix++)for(let iy=0;iy<N;iy++)if(valid(ix,iy)){const dist=(ix-pos.x)**2+(iy-pos.y)**2;if(!best||dist<best.dist)best={x:ix,y:iy,dist}}if(best){pos.x=best.x;pos.y=best.y}}piece.style.transition='transform 110ms ease-out';paint();setTimeout(()=>piece.style.transition='',130);stats.textContent='تم تثبيت القطعة — جرّب سحبة ثانية'}
board.addEventListener('pointerdown',down);board.addEventListener('pointermove',move);board.addEventListener('pointerup',up);board.addEventListener('pointercancel',up);document.getElementById('reset').onclick=()=>{pos={x:1,y:1};drag=null;piece.style.transition='';paint();stats.textContent='جاهز للتجربة'};window.addEventListener('resize',layout);layout();
</script></main></body></html>
